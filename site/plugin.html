<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Old detail URL: plugin.html?name=<plugin>. Maps it to the portfolio's
         /{lang}/plugins/<plugin>/ page; see index.html for why this is a shell. -->
    <title>21-breakincode plugin moved</title>
    <meta name="robots" content="noindex" />
    <script>
      var PLUGIN_SLUG = /^[a-z0-9]+(-[a-z0-9]+)*$/;
      var name = new URLSearchParams(location.search).get("name") || "";
      try {
        var lang = localStorage.getItem("lang") === "zh-TW" ? "zh-TW" : "en";
      } catch (error) {
        var lang = "en";
      }
      var path = PLUGIN_SLUG.test(name) ? name + "/" : "";
      location.replace("https://21-breakincode.com/" + lang + "/plugins/" + path);
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=https://21-breakincode.com/en/plugins/" /></noscript>
  </head>
  <body>
    <p>Moved to <a href="https://21-breakincode.com/en/plugins/">21-breakincode.com/en/plugins/</a>.</p>
  </body>
</html>
