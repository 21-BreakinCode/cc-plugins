<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The showcase moved to the portfolio domain (static, crawlable pages).
         GitHub Pages cannot send a 301, so this shell redirects and declares
         the new URL canonical. -->
    <title>21-breakincode plugins moved</title>
    <link rel="canonical" href="https://21-breakincode.com/en/plugins/" />
    <meta name="robots" content="noindex" />
    <script>
      try {
        var lang = localStorage.getItem("lang") === "zh-TW" ? "zh-TW" : "en";
      } catch (error) {
        var lang = "en";
      }
      location.replace("https://21-breakincode.com/" + lang + "/plugins/");
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=https://21-breakincode.com/en/plugins/" /></noscript>
  </head>
  <body>
    <p>Moved to <a href="https://21-breakincode.com/en/plugins/">21-breakincode.com/en/plugins/</a>.</p>
  </body>
</html>
